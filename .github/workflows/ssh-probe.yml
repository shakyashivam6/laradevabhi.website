name: ssh-probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ssh
        run: |
          set +e
          H=103.20.213.246; P=23286
          echo "RUNNER_IP=$(curl -s -m 10 https://api.ipify.org)"
          echo "" | base64 -d > /tmp/k1; chmod 600 /tmp/k1
          echo "" | base64 -d > /tmp/k2; chmod 600 /tmp/k2
          head -1 /tmp/k1; head -1 /tmp/k2
          try(){ u="$1"; k="$2"; echo "== key$k user=$u =="; timeout 20 ssh -i /tmp/k$k -oStrictHostKeyChecking=no -oUserKnownHostsFile=/dev/null -oIdentitiesOnly=yes -oBatchMode=yes -oConnectTimeout=8 -p $P "$u@$H" 'id; hostname; whoami' 2>&1 | tail -2; }
          try root 1
          try ubuntu 1
          try supportfly 1
          try deploy 1
          echo DONE_ALL
